# Cumulative clone counter for the README badge.
#
# GitHub only exposes clone statistics for the last 14 days, to users with push
# access, through the traffic API. This job runs daily, merges the per-day
# counts into a history kept on the orphan branch `traffic`, and publishes a
# shields.io "endpoint" JSON that the README badge reads:
#
#   https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/Vitruves/carquet/traffic/clones.json
#
# Setup (one time): the default GITHUB_TOKEN cannot read traffic endpoints.
# Create a personal access token (classic: scope `repo`; fine-grained:
# repository permission "Administration: read") and store it as the repository
# secret TRAFFIC_TOKEN. The first run seeds the history with the 14 days the API
# still holds; the total then only grows.

name: Clone count badge

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch traffic and update history
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "TRAFFIC_TOKEN secret is not set; nothing to do." >&2
            exit 0
          fi
          gh api "repos/${REPO}/traffic/clones" > clones-api.json
          gh api "repos/${REPO}/traffic/views"  > views-api.json

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git init -q work
          cd work
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git"
          if git fetch -q origin traffic 2>/dev/null; then
            git checkout -q -b traffic FETCH_HEAD
          else
            git checkout -q --orphan traffic
            echo "# Traffic history (generated by .github/workflows/clone-count.yml)" > README.md
          fi

          python3 - <<'EOF'
          import json, os, datetime
          def load(path):
              try:
                  with open(path) as f: return json.load(f)
              except FileNotFoundError:
                  return {}
          hist = load("history.json")
          clones = hist.setdefault("clones", {})
          views = hist.setdefault("views", {})
          for day in json.load(open("../clones-api.json")).get("clones", []):
              clones[day["timestamp"][:10]] = {"count": day["count"], "uniques": day["uniques"]}
          for day in json.load(open("../views-api.json")).get("views", []):
              views[day["timestamp"][:10]] = {"count": day["count"], "uniques": day["uniques"]}
          total = sum(d["count"] for d in clones.values())
          uniq = sum(d["uniques"] for d in clones.values())
          hist["updated"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          hist["since"] = min(clones) if clones else None
          hist["total_clones"] = total
          hist["total_unique_cloners_daily_sum"] = uniq
          json.dump(hist, open("history.json", "w"), indent=1, sort_keys=True)
          def short(n):
              return f"{n/1_000_000:.1f}M" if n >= 1_000_000 else (f"{n/1000:.1f}k" if n >= 10_000 else str(n))
          badge = {"schemaVersion": 1, "label": "clones",
                   "message": f"{short(total)} since {hist['since']}", "color": "blue"}
          json.dump(badge, open("clones.json", "w"))
          print(f"total clones {total} since {hist['since']} ({len(clones)} days recorded)")
          EOF

          git add README.md history.json clones.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -q -m "traffic: update clone history"
            git push -q origin traffic
          fi
